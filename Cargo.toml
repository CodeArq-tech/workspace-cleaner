[package]
name = "workspace-cleaner"
version = "0.1.0"
edition = "2021"
description = "Back up and clean stale Git worktrees"
license = "MIT"

[[bin]]
name = "git-workspace-cleaner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
